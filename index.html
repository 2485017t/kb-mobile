<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="けさの kb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2129" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>けさの kb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
/* 片手で読む手帳: 上に日付とタブ、本文は1列。表だけ横にスクロール。中身は合言葉で開く */
:root {
  --bg: #f3f5f7; --paper: #ffffff; --ink: #1d2733; --sub: #5d6b7a; --line: #d9e0e7;
  --accent: #2c4f7c; --accent-soft: #e3ebf5; --warn: #b4472e;
  --zebra: #f6f8fa; --tip-bg: #fbf6ec; --tip-line: #ebdfc8; --tip-ink: #4a3f2e;
  --round: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", sans-serif;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12171d; --paper: #1a2129; --ink: #e4e9ef; --sub: #98a5b3; --line: #2c3742;
  --accent: #8fb3e3; --accent-soft: #233246; --warn: #e88a70;
  --zebra: #1e262f; --tip-bg: #26241f; --tip-line: #3b362c; --tip-ink: #e8dfcf; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.75; -webkit-text-size-adjust: 100%; padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
[hidden] { display: none !important; }
.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-direction: column; gap: 6px; padding-block: 10px 8px; }
.head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.date { font-family: var(--display); font-size: 1.45rem; letter-spacing: .02em; text-wrap: balance; }
.updated { color: var(--sub); font-size: .8rem; font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav button, .btn { flex: none; font: inherit; font-size: .9rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--sub); cursor: pointer; }
nav button[aria-current="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 700; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main .wrap { padding-block: 8px 48px; }
.note { min-width: 0; overflow-wrap: anywhere; }
.note h1 { display: none; }
.note h2 { font-family: var(--display); font-size: 1.2rem; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.note h3 { font-size: 1rem; margin: 18px 0 4px; color: var(--accent); }
.note p { margin: 10px 0; }
.note ul, .note ol { margin: 8px 0; padding-left: 1.3em; }
.note li { margin: 7px 0; }
.note li > ul, .note li > ol { margin: 4px 0 2px; font-size: .92rem; color: var(--sub); }
.note li > ul li, .note li > ol li { margin: 3px 0; }
/* 読みやすさ: 行頭の「ラベル:」は小さなチップ、長いかっこ書きの補足は薄く小さく、「 — 」のあとは次の行に。強調はこの3つに絞る */
.lab { display: inline-block; font-size: .76rem; font-weight: 700; line-height: 1.55; padding: 0 7px; margin-right: 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; text-indent: 0; }
.paren { color: var(--sub); font-size: .88em; }
.line2 { display: block; color: var(--sub); font-size: .9em; line-height: 1.6; text-indent: 0; }
.note a { color: var(--accent); text-underline-offset: 2px; }
.note code { font-size: .85em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.note blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--sub); }
.table { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.table table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.table tr:last-child td { border-bottom: 0; }
.table th { color: var(--sub); font-weight: 700; background: var(--accent-soft); }
.aside { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--sub); font-size: .9rem; }
.empty { color: var(--sub); padding: 32px 0; }
/* 勉強タブ: 休日・水曜は型を2つから選ぶ */
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
.seg button { font: inherit; font-size: .9rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--sub); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.src { color: var(--sub); font-size: .8rem; margin-top: 24px; }
/* 勉強タブ: 重点と明日は開け閉め。時間割は左に時刻、右にやること・範囲。やり方は別表 */
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--sub); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
details.focus { margin: 12px 0 0; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
details.focus > summary { font-weight: 700; }
details.focus ul { margin: 4px 0 2px; font-size: .92rem; }
details.next { margin: 32px 0 0; padding-top: 16px; border-top: 3px double var(--line); }
details.next > summary { font-family: var(--display); font-size: 1.25rem; }
/* 時間割: 時刻の列と内容の列の表。◎ は「必ず」のバッジ */
.ttwrap { margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.tt { width: 100%; border-collapse: collapse; }
.tt tr + tr > * { border-top: 1px solid var(--line); }
.tt th { width: 4.8em; padding: 11px 6px 11px 12px; text-align: left; vertical-align: top; background: var(--zebra); font-variant-numeric: tabular-nums; }
.tt .t1 { display: block; font-size: .95rem; line-height: 1.3; }
.tt .t2 { display: block; margin-top: 2px; font-size: .74rem; font-weight: 400; line-height: 1.4; color: var(--sub); }
.tt .t1.small { font-size: .76rem; line-height: 1.45; }
.tt .t1.word { font-size: .84rem; line-height: 1.45; word-break: keep-all; }
.tt tr.must .t1 { color: var(--accent); }
.tt td { padding: 11px 12px 11px 10px; vertical-align: top; }
.tt .h { font-weight: 700; line-height: 1.5; }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: .68rem; font-weight: 700; line-height: 1.65; vertical-align: 2px; background: var(--accent); color: var(--paper); }
.badge.opt { background: transparent; color: var(--sub); border: 1px solid var(--line); }
.tt .r { margin-top: 5px; font-size: .93rem; line-height: 1.65; }
.tt .h + .r, .tt .r:first-child { margin-top: 3px; }
.tt .do { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 4px; font-size: .74rem; font-weight: 700; line-height: 1.65; vertical-align: 1px; background: var(--accent-soft); color: var(--accent); }
.tt .warn-note { margin-top: 3px; color: var(--warn); font-size: .82rem; line-height: 1.5; }
.tt .empty-row { color: var(--sub); font-size: .88rem; }
/* やり方: やわらかい丸ゴシックの tips カード。「→」の手順は番号付きの段落に */
.tips { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; font-family: var(--round); }
.tip { padding: 12px 14px; border: 1px solid var(--tip-line); border-radius: 14px; background: var(--tip-bg); color: var(--tip-ink); font-size: .92rem; line-height: 1.75; }
.tip-h { margin-bottom: 2px; font-weight: 700; }
.tip-h::before { content: "💡"; margin-right: 6px; }
.tip.always .tip-h::before { content: "🌿"; }
.tip ol { margin: 4px 0; padding-left: 1.5em; }
.tip li { margin: 3px 0; padding-left: 2px; }
.tip li::marker { color: var(--accent); font-weight: 700; }
.tip p { margin: 4px 0; }
.tip .paren { color: inherit; opacity: .72; }
.tip.always { background: transparent; border-style: dashed; }
details.focus li { margin: 5px 0; }
.pace { margin-left: .4em; color: var(--sub); font-size: .8rem; white-space: nowrap; }
.pace.late { color: var(--warn); font-weight: 700; }
.err { color: var(--warn); }
.lock { display: flex; flex-direction: column; gap: 14px; padding-block: 18vh 32px; max-width: 24rem; }
.lock h1 { font-family: var(--display); font-size: 1.6rem; margin: 0; }
.lock p { margin: 0; color: var(--sub); font-size: .92rem; }
.lock form { display: flex; flex-direction: column; gap: 10px; }
.lock input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.lock .btn { align-self: flex-start; font-size: 1rem; padding: 8px 20px; }
.foot { display: flex; justify-content: flex-end; padding-block: 0 32px; }
/* 勉強タブの目次: ヘッダーの下に貼りつく */
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h, 92px)); z-index: 4; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.anchor { scroll-margin-top: calc(var(--head-h, 92px) + 52px); }
/* 日ごとのタブ: カレンダーはリンク、メール・ニュースはたたむ */
.calrow { margin: 20px 0 4px; display: flex; flex-wrap: wrap; gap: 8px; }
/* タスクのタブ(Notion の GTD) */
.gtd-group h2 { display: flex; align-items: baseline; gap: 8px; }
.gtd-n { color: var(--sub); font-family: var(--body); font-size: .8rem; font-weight: 400; }
details.gtd-group > summary .gtd-n { margin-left: 8px; }
.note ul.gtd { list-style: none; padding: 0; margin: 6px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); overflow: hidden; }
.note ul.gtd li { margin: 0; padding: 10px 12px; line-height: 1.6; }
.note ul.gtd li + li { border-top: 1px solid var(--line); }
.note ul.gtd li.today { box-shadow: inset 3px 0 0 var(--accent); }
.note ul.gtd a { color: var(--ink); text-decoration: none; }
.gtd .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.gtd .meta .lab { margin: 0; }
.gtd .lab.doing { background: transparent; border: 1px solid var(--accent); }
.gtd .mins { color: var(--sub); font-size: .8rem; }
details.gtd-group ul.gtd { margin-top: 8px; }
.note ul.gtd li { display: flex; align-items: flex-start; gap: 8px; }
.gtd .body { flex: 1; min-width: 0; }
.gtd .del { flex: none; border: 1px solid var(--line); background: transparent; color: var(--sub); border-radius: 8px; padding: 2px 8px; font-size: .9rem; }
.gtd li.gone { opacity: .4; }
.note li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; padding-left: 1.4em; text-indent: -1.4em; }
.note li > input[type="checkbox"] { margin: 0 .4em 0 0; }
.btn.cal { display: inline-block; text-decoration: none; color: var(--accent); border-color: var(--accent); font-weight: 700; padding: 6px 14px; }
.sub { color: var(--sub); font-size: .88rem; }
details.sec { margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
details.sec > summary { font-weight: 700; }
details.sec > summary.warn { color: var(--warn); }
details.sec .count { display: block; margin-left: 1.1em; font-weight: 400; font-size: .82rem; color: var(--sub); }
details.sec > summary.warn .count { color: var(--warn); }
/* 今日のメモ: 右上のボタンで下から出す */
.head-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.btn.memo-btn { color: var(--accent); border-color: var(--accent); font-weight: 700; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; }
.sheet-box { width: 100%; max-height: 88vh; overflow-y: auto; background: var(--paper); border-radius: 14px 14px 0 0; padding-top: 12px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 1.05rem; }
.sheet .memo { margin-top: 8px; padding-top: 0; border-top: 0; }
body.sheet-open { overflow: hidden; }
/* 単語テスト: 1枚ずつめくるカード。結果は iPhone のショートカットで Dropbox に置く */
.quiz { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
.quiz .count { color: var(--sub); font-size: .85rem; font-variant-numeric: tabular-nums; }
.card { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 42vh; padding: 28px 18px; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; overflow-wrap: anywhere; }
.card .q { font-size: 1.7rem; font-weight: 700; line-height: 1.4; }
.card .a { font-size: 1.05rem; }
.card .ex { color: var(--sub); font-size: .92rem; }
.quiz .row { display: flex; gap: 10px; }
.quiz .row .btn { flex: 1; font-size: 1.05rem; padding: 12px; border-radius: 10px; }
.btn.forgot { border-color: var(--warn); color: var(--warn); font-weight: 700; }
.quiz .small { display: flex; justify-content: space-between; gap: 10px; }
.quiz ul { margin: 0; padding-left: 1.3em; }
/* 勉強メモ: できなかった・変えたことを iPhone のショートカットで Dropbox に置く */
.memo { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.memo h2 { margin: 0; font-size: 1.05rem; }
.memo .seg { margin: 0; }
.memo label { color: var(--sub); font-size: .85rem; }
.memo textarea { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; min-height: 2.6em; }
.memo .row { display: flex; }
.memo .row .btn { flex: 1; font-size: 1.05rem; padding: 10px; border-radius: 10px; }
</style>
</head>
<body>
<section id="lock" class="wrap lock" hidden>
  <h1>けさの kb</h1>
  <p>PC で決めた合言葉を入れてください。この iPhone に覚えておくので、次からは入れなくても開けます。</p>
  <form id="lockForm">
    <label for="pass" class="sr">合言葉</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="unlock">開く</button>
  </form>
  <p id="lockMsg" class="err" hidden></p>
</section>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="head-row"><span class="date" id="title">読み込み中</span><span class="head-right"><span class="updated" id="updated"></span><button class="btn memo-btn" type="button" id="memoBtn" aria-haspopup="dialog">✎ メモ</button></span></div>
      <nav id="tabs" aria-label="表示の切り替え"></nav>
    </div>
  </header>
  <main><div class="wrap"><div class="note" id="view"></div></div></main>
  <div class="sheet" id="memoSheet" role="dialog" aria-modal="true" aria-labelledby="memoTitle" hidden>
    <div class="sheet-box wrap">
      <div class="sheet-head"><span id="memoTitle">今日のメモ</span><button class="btn" type="button" id="memoClose">閉じる</button></div>
      <div id="memoBody"></div>
    </div>
  </div>
  <div class="wrap foot"><button class="btn" type="button" id="forget">この iPhone の合言葉を消す</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const KEY = "kb-mobile-key";
const WEEK = "日月火水木金土";
const label = d => { const t = new Date(d + "T00:00:00"); return `${t.getMonth() + 1}/${t.getDate()}(${WEEK[t.getDay()]})`; };
const $ = id => document.getElementById(id);
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

const renderer = new marked.Renderer();
renderer.link = (href, title, text) => /^https?:\/\//.test(href || "") ? `<a href="${href}" target="_blank" rel="noopener">${text}</a>` : text;
renderer.table = (head, body) => `<div class="table"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
marked.setOptions({ renderer, gfm: true, breaks: false, mangle: false, headerIds: false });

// 生の HTML は出さない(メールの要約などが混ざるため)。音声の印は案内に置き換える
const render = md => md.split(/^<<audio \d{4}-\d{2}-\d{2}>>$/m).map((part, i) =>
  (i ? `<div class="aside">聞くニュースの音声は Obsidian か claude.ai のページで聞けます。</div>` : "") +
  marked.parse(part.replace(/</g, "&lt;"))).join("");

async function deriveRaw(pass, enc) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, 256);
}
async function decrypt(raw, enc) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};

let enc = null, data = null;
function showLock(msg) {
  $("app").hidden = true; $("lock").hidden = false;
  $("lockMsg").hidden = !msg; $("lockMsg").textContent = msg || "";
}

// 単語テストの進み具合はこの iPhone にだけ覚えておく(閉じても続きから)
const SHORTCUT = "単語テスト結果";
const quizKey = () => "kb-toeic-" + data.toeic.date;
const quizLoad = () => { try { return JSON.parse(localStorage.getItem(quizKey())) || null; } catch (e) { return null; } };
const quizSave = q => { try { localStorage.setItem(quizKey(), JSON.stringify(q)); } catch (e) {} };
let quiz = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(text, cls, fn) { const b = el("button", "btn " + (cls || ""), text); b.type = "button"; b.addEventListener("click", fn); return b; }

function showQuiz() {
  const cards = data.toeic.cards, view = $("view");
  quiz = quiz || quizLoad() || { i: 0, wrong: [], open: false, sent: false };
  quizSave(quiz);
  view.innerHTML = "";
  const box = el("div", "quiz");
  if (quiz.i < cards.length) {
    const c = cards[quiz.i];
    box.appendChild(el("div", "count", `${quiz.i + 1} / ${cards.length}問 ・ 忘れた ${quiz.wrong.length}`));
    const card = el("div", "card");
    card.appendChild(el("div", "q", c.q));
    if (quiz.open) {
      card.appendChild(el("div", "a", c.a));
      if (c.ex) card.appendChild(el("div", "ex", c.ex));
    } else {
      card.appendChild(el("div", "ex", "思い浮かべたらタップ"));
      card.addEventListener("click", () => { quiz.open = true; showQuiz(); });
    }
    box.appendChild(card);
    const row = el("div", "row");
    const next = forgot => () => { if (forgot) quiz.wrong.push(quiz.i + 1); quiz.i++; quiz.open = false; showQuiz(); };
    if (quiz.open) { row.appendChild(btn("忘れた", "forgot", next(true))); row.appendChild(btn("覚えてた", "primary", next(false))); }
    else row.appendChild(btn("答えを見る", "primary", () => { quiz.open = true; showQuiz(); }));
    box.appendChild(row);
    if (quiz.i > 0) {
      const small = el("div", "small");
      small.appendChild(btn("ひとつ戻る", "", () => {

const studyOpen = (k, def) => { try { const v = localStorage.getItem("kb-study-open-" + k); return v == null ? def : v === "1"; } catch (e) { return def; } };
const studyKeep = (k, open) => { try { localStorage.setItem("kb-study-open-" + k, open ? "1" : "0"); } catch (e) {} };

// 長い補足のかっこ書き(10字以上)を薄く小さく。文字列 → 要素の集まり
const PAREN = /([(（][^()（）]{10,}[)）])/;
function softText(text) {
  const f = document.createDocumentFragment();
  text.split(PAREN).forEach((part, i) => { if (part) f.appendChild(i % 2 ? el("span", "paren", part) : document.createTextNode(part)); });
  return f;
}
// Markdown を出したあとに、行頭の「ラベル:」をチップに、「 — 」のあとを次の行に、長いかっこ書きを薄くする
function soften(root) {
  for (const li of root.querySelectorAll("li")) {
    const first = [...li.childNodes].find(n => (n.nodeType === 3 && n.textContent.trim()) || (n.nodeType === 1 && n.tagName !== "INPUT"));
    if (first && first.nodeType === 3) {
      const m = first.textContent.match(/^\s*([^\d\s:：()（）「」\[][^\s:：()（）「」]{0,9})[:：]\s*/);
      if (m) { first.textContent = first.textContent.slice(m[0].length); li.insertBefore(el("span", "lab", m[1]), first); }
    }
    for (const n of [...li.childNodes]) {
      if (n.nodeType !== 3 || !n.textContent.trim()) continue;
      const t = n.textContent, k = t.indexOf(" — "), frag = document.createDocumentFragment();
      frag.appendChild(softText(k < 0 ? t : t.slice(0, k)));
      if (k >= 0) { const s2 = el("span", "line2"); s2.appendChild(softText(t.slice(k + 3))); frag.appendChild(s2); }
      n.replaceWith(frag);
    }
  }
  return root;
}
const mdBox = (md, cls) => { const d = el("div", cls || ""); d.innerHTML = render(md); return soften(d); };
// 「。」で文に分ける(かっこの中の「。」では切らない)
function sentences(t) {
  const out = []; let cur = "", depth = 0;
  for (const c of t) {
    if ("(（".includes(c)) depth++; else if (")）".includes(c)) depth = Math.max(0, depth - 1);
    if (c === "。" && !depth) { if (cur.trim()) out.push(cur.trim()); cur = ""; } else cur += c;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

function studyDay(view, s, id) {
  const vkey = "kb-study-" + s.date;
  let pick = ""; try { pick = localStorage.getItem(vkey) || ""; } catch (e) {}
  const v = s.variants.find(x => x.key === pick) || s.variants[0];
  if (s.variants.length > 1) {
    const seg = el("div", "seg");
    for (const x of s.variants) {
      const b = el("button", "", x.label);
      b.type = "button"; b.setAttribute("aria-pressed", String(x === v));
      b.addEventListener("click", () => { try { localStorage.setItem(vkey, x.key); } catch (e) {} showStudy($("view")); });
      seg.appendChild(b);
    }
    view.appendChild(seg);
  }
  if (!v.blocks) view.insertAdjacentHTML("beforeend", render(v.md));  // 古い形のデータ
  else {
    if (v.focus.length) {
      const f = fold("focus", "focus", true, `${s.word || label(s.date)}の重点`);
      const ul = el("ul");
      for (const x of v.focus) {  // 先頭の種類はチップ、進み具合は右に小さく(遅れは赤)
        const li = el("li"); let t = x;
        const m = t.match(/^(講義|演習|解き直し|TOEIC|予定|見直し)[:：]?\s*/);
        if (m) { li.appendChild(el("span", "lab", m[1])); t = t.slice(m[0].length); }
        const p = t.match(/\s(\d+\/\d+日目|\d+日遅れ|前倒し|\S+から)$/);
        if (p) t = t.slice(0, p.index);
        li.appendChild(softText(t));
        if (p) li.appendChild(el("span", "pace" + (p[1].includes("遅れ") ? " late" : ""), p[1]));
        ul.appendChild(li);
      }
      f.appendChild(ul);
      view.appendChild(f);
    }
    view.appendChild(el("h2", "", "時間割"));
    const wrap = el("div", "ttwrap"), tt = el("table", "tt");
    for (const b of v.blocks) {
      const tr = el("tr", b.mark === "◎" ? "must" : ""), th = el("th"), td = el("td");
      th.scope = "row";
      const k = b.time.indexOf("〜");
      if (!b.time) th.appendChild(el("span", "t1 word", b.title.replace(/([・ ])/g, "$1​").replace(/[(（]/g, "​$&")));  // 「電車・バス」は「・」で折り返す
      else if (k > 0 && b.time.indexOf("〜", k + 1) < 0) { th.appendChild(el("span", "t1", b.time.slice(0, k))); th.appendChild(el("span", "t2", b.time.slice(k))); }
      else th.appendChild(el("span", "t1 small", b.time));
      if ((b.time && b.title) || b.mark) {
        const h = el("div", "h", b.time ? b.title : "");
        if (b.mark) h.appendChild(el("span", "badge" + (b.mark === "◎" ? "" : " opt"), b.mark === "◎" ? "必ず" : "できれば"));
        td.appendChild(h);
      }
      if (b.note) td.appendChild(el("div", "warn-note", b.note));
      for (const r of b.rows) {
        const p = el("div", "r");
        if (r.do) p.appendChild(el("span", "do", r.do));
        if (r.range) p.appendChild(softText(r.range));
        td.appendChild(p);
      }
      if (!td.childNodes.length) td.appendChild(el("span", "empty-row", "―"));
      tr.appendChild(th); tr.appendChild(td); tt.appendChild(tr);
    }
    wrap.appendChild(tt);
    view.appendChild(wrap);
    const how = el("h2", "anchor", "やり方"); how.id = "study-how-" + id;
    view.appendChild(how);
    const tips = el("div", "tips");
    for (const [k, t] of v.how) {
      const card = el("div", "tip" + (k === "いつも" ? " always" : ""));
      card.appendChild(el("div", "tip-h", k));
      for (const sn of sentences(t)) {
        if (sn.includes(" → ")) {
          const ol = el("ol");
          for (const x of sn.split(" → ")) { const li = el("li"); li.appendChild(softText(x)); ol.appendChild(li); }
          card.appendChild(ol);
        } else { const p = el("p"); p.appendChild(softText(sn)); card.appendChild(p); }
      }
      tips.appendChild(card);
    }
    view.appendChild(tips);
  }
  view.appendChild(el("p", "src", `${label(s.date)}の分。進み具合: ${s.source}`));
}

// 日ごとのタブ。Daily をそのまま出さず、計画と単語を上に、カレンダーはリンクだけ、メール・ニュース・計画のメモはたたむ。
// 今日のタスク(やること・すぐ済むこと・持ち越し)は「タスク」のタブ、過ぎた日のタスクはたたんでここに
const CAL = "https://calendar.google.com/calendar/r/week";
function showDay(view, day, isToday) {
  if (!day.blocks) { view.innerHTML = render(day.md); return; }
  view.innerHTML = "";
  const order = { plain: 0, cal: 1, fold: 2 };
  const blocks = [...day.blocks].sort((a, b) => order[a.kind] - order[b.kind]);
  for (const b of blocks) {
    if (b.kind === "plain") {
      if (b.title) view.appendChild(el("h2", "", b.title));
      view.appendChild(mdBox(b.md));
    } else if (b.kind === "cal") {
      const a = el("a", "btn cal", "📅 カレンダーで予定を見る"); a.href = CAL; a.target = "_blank"; a.rel = "noopener";
      const row = el("p", "calrow"); row.appendChild(a);
      if (isToday && data.gtd && data.gtd.url) row.appendChild(gtdLink(data.gtd.url, "✅ Notion のタスク"));
      view.appendChild(row);
      if (b.md) view.appendChild(mdBox(b.md, "sub"));
    } else {
      const f = el("details", "sec");
      const sm = el("summary", b.warn ? "warn" : "", b.title);
      if (b.summary) sm.appendChild(el("span", "count", b.summary));
      f.appendChild(sm);
      f.appendChild(mdBox(b.md));
      view.appendChild(f);
    }
  }
  if (!isToday && day.tasks) {
    const f = el("details", "sec"); f.appendChild(el("summary", "", "この日のタスク"));
    f.appendChild(mdBox(day.tasks)); view.appendChild(f);
  }
}

// タスクのタブ: Notion の GTD taskDB の未完了タスクを option ごとに。今日の計画から入ったものに「今日」。
// 上の2つ(すぐにやること・次にやるべきこと)は開き、ほかはたたむ。Notion が読めない日は Daily のタスクを出す
const GTD_OPEN = ["☑すぐにやること", "🔆次にやるべきこと"];
function gtdLink(url, text) { const a = el("a", "btn cal", text); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; }
// 🗑: Notion のページ id だけを ntfy に送る(公開サーバーなので名前は送らない)。PC の次のページ作り(朝・夜)で受け取り、
// 次の朝の計画(kb-plan)が Notion で option を「🗑️ゴミ箱」にする。それまではこの端末で隠しておく(3日で忘れる)
const GTD_DEL_KEY = "kb-gtd-del";
const gtdGone = () => { try { const o = JSON.parse(localStorage.getItem(GTD_DEL_KEY)) || {}; const now = Date.now();
  for (const k in o) if (now - o[k] > 3 * 864e5) delete o[k]; return o; } catch (e) { return {}; } };
const gtdForget = id => { try { const o = gtdGone(); o[id] = Date.now(); localStorage.setItem(GTD_DEL_KEY, JSON.stringify(o)); } catch (e) {} };
async function gtdTrash(t, li, btn) {
  if (!confirm(`「${t.name}」を Notion のゴミ箱に入れますか?(次の朝の計画で反映)`)) return;
  btn.disabled = true;
  try {
    const r = await fetch("https://ntfy.sh/" + data.gtd.del_topic, { method: "POST", body: t.id });
    if (!r.ok) throw new Error(r.status);
    gtdForget(t.id); li.classList.add("gone"); btn.textContent = "済";
  } catch (e) { btn.disabled = false; alert("送れませんでした(通信を確かめてもう一度)"); }
}
function showTasks(view) {
  view.innerHTML = "";
  const g = data.gtd, daily = data.days[0] && data.days[0].tasks;
  if (g && g.url) { const row = el("p", "calrow"); row.appendChild(gtdLink(g.url, "✅ Notion の GTD を開く")); view.appendChild(row); }
  if (!g || !g.tasks) {
    view.appendChild(el("p", "sub", `Notion のタスクを読めなかったので、今日の計画のタスクを出しています${g && g.error ? `(${g.error})` : ""}。`));
    view.appendChild(daily ? mdBox(daily) : el("p", "empty", "今日のタスクはまだありません(朝の計画ができると入ります)。"));
    return;
  }
  if (!g.tasks.length) { view.appendChild(el("p", "empty", "未完了のタスクはありません。")); return; }
  const groups = new Map();
  const gone = gtdGone();
  for (const t of g.tasks) { if (t.id && gone[t.id]) continue; const k = t.option || "(option なし)"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  for (const [opt, list] of groups) {
    const box = GTD_OPEN.includes(opt) ? el("section", "gtd-group") : el("details", "sec gtd-group");
    const head = el(GTD_OPEN.includes(opt) ? "h2" : "summary", "", opt);
    head.appendChild(el("span", "gtd-n", `${list.length}件`));
    box.appendChild(head);
    const ul = el("ul", "gtd");
    for (const t of [...list].sort((x, y) => y.today - x.today)) {  // 今日の計画の分を上に
      const li = el("li", t.today ? "today" : ""), body = el("div", "body");
      const a = el("a", "", t.name); a.href = t.url; a.target = "_blank"; a.rel = "noopener";
      body.appendChild(a); li.appendChild(body);
      const meta = el("span", "meta");
      if (t.today) meta.appendChild(el("span", "lab", "今日"));
      if (t.status === "進行中") meta.appendChild(el("span", "lab doing", "進行中"));
      if (t.minutes) meta.appendChild(el("span", "mins", `${t.minutes}分`));
      if (meta.childNodes.length) body.appendChild(meta);
      if (g.del_topic && t.id) { const b = el("button", "del", "🗑"); b.type = "button"; b.setAttribute("aria-label", "ゴミ箱に入れる");
        b.addEventListener("click", () => gtdTrash(t, li, b)); li.appendChild(b); }
      ul.appendChild(li);
    }
    box.appendChild(ul);
    view.appendChild(box);
  }
  view.appendChild(el("p", "src", `Notion の GTD taskDB(${g.at} に読んだ)。終わったら Notion でステータスを「完了」に。要らないものは🗑(次の朝に Notion でゴミ箱へ)`));
}

  } catch (err) { showLock("合言葉が違うようです。PC の合言葉ファイルの1行目と同じか確かめてください。"); }
  $("unlock").disabled = false;
});
$("forget").addEventListener("click", () => { store.clear(); data = null; showLock(); });

(async () => {
  try {
    const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    enc = await r.json();
  } catch (e) {
    $("lock").hidden = false; $("lockForm").hidden = true;
    $("lockMsg").hidden = false; $("lockMsg").textContent = "データを読み込めませんでした。電波のよい所で開き直してください。";
    return;
  }
  const saved = store.get();
  if (saved) {
    try { data = await decrypt(unb64(saved), enc); open(); return; }
    catch (e) { store.clear(); showLock("合言葉が変わったようです。もう一度入れてください。"); return; }
  }
  showLock();
})();
</script>
</body>
