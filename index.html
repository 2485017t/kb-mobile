<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="けさの kb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2129" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>けさの kb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 片手で読む手帳: 上に日付とタブ、本文は1列。表だけ横にスクロール。中身は合言葉で開く */
:root {
  --bg: #f3f5f7; --paper: #ffffff; --ink: #1d2733; --sub: #5d6b7a; --line: #d9e0e7;
  --accent: #2c4f7c; --accent-soft: #e3ebf5; --warn: #b4472e;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12171d; --paper: #1a2129; --ink: #e4e9ef; --sub: #98a5b3; --line: #2c3742;
  --accent: #8fb3e3; --accent-soft: #233246; --warn: #e88a70; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.75; -webkit-text-size-adjust: 100%; padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
[hidden] { display: none !important; }
.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-direction: column; gap: 6px; padding-block: 10px 8px; }
.head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.date { font-family: var(--display); font-size: 1.45rem; letter-spacing: .02em; text-wrap: balance; }
.updated { color: var(--sub); font-size: .8rem; font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav button, .btn { flex: none; font: inherit; font-size: .9rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--sub); cursor: pointer; }
nav button[aria-current="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 700; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main .wrap { padding-block: 8px 48px; }
.note { min-width: 0; overflow-wrap: anywhere; }
.note h1 { display: none; }
.note h2 { font-family: var(--display); font-size: 1.2rem; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.note h3 { font-size: 1rem; margin: 18px 0 4px; color: var(--accent); }
.note p, .note ul, .note ol { margin: 6px 0; }
.note ul, .note ol { padding-left: 1.3em; }
.note li { margin: 3px 0; }
.note a { color: var(--accent); text-underline-offset: 2px; }
.note code { font-size: .85em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.note blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--sub); }
.table { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.table table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.table tr:last-child td { border-bottom: 0; }
.table th { color: var(--sub); font-weight: 700; background: var(--accent-soft); }
.aside { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--sub); font-size: .9rem; }
.empty { color: var(--sub); padding: 32px 0; }
/* 勉強タブ: 休日・水曜は型を2つから選ぶ */
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
.seg button { font: inherit; font-size: .9rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--sub); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.src { color: var(--sub); font-size: .8rem; margin-top: 24px; }
.err { color: var(--warn); }
.lock { display: flex; flex-direction: column; gap: 14px; padding-block: 18vh 32px; max-width: 24rem; }
.lock h1 { font-family: var(--display); font-size: 1.6rem; margin: 0; }
.lock p { margin: 0; color: var(--sub); font-size: .92rem; }
.lock form { display: flex; flex-direction: column; gap: 10px; }
.lock input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.lock .btn { align-self: flex-start; font-size: 1rem; padding: 8px 20px; }
.foot { display: flex; justify-content: flex-end; padding-block: 0 32px; }
/* 単語テスト: 1枚ずつめくるカード。結果は iPhone のショートカットで Dropbox に置く */
.quiz { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
.quiz .count { color: var(--sub); font-size: .85rem; font-variant-numeric: tabular-nums; }
.card { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 42vh; padding: 28px 18px; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; overflow-wrap: anywhere; }
.card .q { font-size: 1.7rem; font-weight: 700; line-height: 1.4; }
.card .a { font-size: 1.05rem; }
.card .ex { color: var(--sub); font-size: .92rem; }
.quiz .row { display: flex; gap: 10px; }
.quiz .row .btn { flex: 1; font-size: 1.05rem; padding: 12px; border-radius: 10px; }
.btn.forgot { border-color: var(--warn); color: var(--warn); font-weight: 700; }
.quiz .small { display: flex; justify-content: space-between; gap: 10px; }
.quiz ul { margin: 0; padding-left: 1.3em; }
/* 勉強メモ: できなかった・変えたことを iPhone のショートカットで Dropbox に置く */
.memo { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.memo h2 { margin: 0; font-size: 1.05rem; }
.memo .seg { margin: 0; }
.memo label { color: var(--sub); font-size: .85rem; }
.memo textarea { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; min-height: 2.6em; }
.memo .row { display: flex; }
.memo .row .btn { flex: 1; font-size: 1.05rem; padding: 10px; border-radius: 10px; }
</style>
</head>
<body>
<section id="lock" class="wrap lock" hidden>
  <h1>けさの kb</h1>
  <p>PC で決めた合言葉を入れてください。この iPhone に覚えておくので、次からは入れなくても開けます。</p>
  <form id="lockForm">
    <label for="pass" class="sr">合言葉</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="unlock">開く</button>
  </form>
  <p id="lockMsg" class="err" hidden></p>
</section>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="head-row"><span class="date" id="title">読み込み中</span><span class="updated" id="updated"></span></div>
      <nav id="tabs" aria-label="表示の切り替え"></nav>
    </div>
  </header>
  <main><div class="wrap"><div class="note" id="view"></div></div></main>
  <div class="wrap foot"><button class="btn" type="button" id="forget">この iPhone の合言葉を消す</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const KEY = "kb-mobile-key";
const WEEK = "日月火水木金土";
const label = d => { const t = new Date(d + "T00:00:00"); return `${t.getMonth() + 1}/${t.getDate()}(${WEEK[t.getDay()]})`; };
const $ = id => document.getElementById(id);
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

const renderer = new marked.Renderer();
renderer.link = (href, title, text) => /^https?:\/\//.test(href || "") ? `<a href="${href}" target="_blank" rel="noopener">${text}</a>` : text;
renderer.table = (head, body) => `<div class="table"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
marked.setOptions({ renderer, gfm: true, breaks: false, mangle: false, headerIds: false });

// 生の HTML は出さない(メールの要約などが混ざるため)。音声の印は案内に置き換える
const render = md => md.split(/^<<audio \d{4}-\d{2}-\d{2}>>$/m).map((part, i) =>
  (i ? `<div class="aside">聞くニュースの音声は Obsidian か claude.ai のページで聞けます。</div>` : "") +
  marked.parse(part.replace(/</g, "&lt;"))).join("");

async function deriveRaw(pass, enc) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, 256);
}
async function decrypt(raw, enc) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};

let enc = null, data = null;
function showLock(msg) {
  $("app").hidden = true; $("lock").hidden = false;
  $("lockMsg").hidden = !msg; $("lockMsg").textContent = msg || "";
}

// 単語テストの進み具合はこの iPhone にだけ覚えておく(閉じても続きから)
const SHORTCUT = "単語テスト結果";
const quizKey = () => "kb-toeic-" + data.toeic.date;
const quizLoad = () => { try { return JSON.parse(localStorage.getItem(quizKey())) || null; } catch (e) { return null; } };
const quizSave = q => { try { localStorage.setItem(quizKey(), JSON.stringify(q)); } catch (e) {} };
let quiz = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(text, cls, fn) { const b = el("button", "btn " + (cls || ""), text); b.type = "button"; b.addEventListener("click", fn); return b; }

function showQuiz() {
  const cards = data.toeic.cards, view = $("view");
  quiz = quiz || quizLoad() || { i: 0, wrong: [], open: false, sent: false };
  quizSave(quiz);
  view.innerHTML = "";
  const box = el("div", "quiz");
  if (quiz.i < cards.length) {
    const c = cards[quiz.i];
    box.appendChild(el("div", "count", `${quiz.i + 1} / ${cards.length}問 ・ 忘れた ${quiz.wrong.length}`));
    const card = el("div", "card");
    card.appendChild(el("div", "q", c.q));
    if (quiz.open) {
      card.appendChild(el("div", "a", c.a));
      if (c.ex) card.appendChild(el("div", "ex", c.ex));
    } else {
      card.appendChild(el("div", "ex", "思い浮かべたらタップ"));
      card.addEventListener("click", () => { quiz.open = true; showQuiz(); });
    }
    box.appendChild(card);
    const row = el("div", "row");
    const next = forgot => () => { if (forgot) quiz.wrong.push(quiz.i + 1); quiz.i++; quiz.open = false; showQuiz(); };
    if (quiz.open) { row.appendChild(btn("忘れた", "forgot", next(true))); row.appendChild(btn("覚えてた", "primary", next(false))); }
    else row.appendChild(btn("答えを見る", "primary", () => { quiz.open = true; showQuiz(); }));
    box.appendChild(row);
    if (quiz.i > 0) {
      const small = el("div", "small");
      small.appendChild(btn("ひとつ戻る", "", () => {
        quiz.i--; quiz.open = false; quiz.wrong = quiz.wrong.filter(n => n !== quiz.i + 1); showQuiz();
      }));
      box.appendChild(small);
    }
  } else {
    box.appendChild(el("p", "", `${cards.length}問中 覚えてた ${cards.length - quiz.wrong.length}・忘れた ${quiz.wrong.length}`));
    if (quiz.wrong.length) {
      const ul = el("ul");
      for (const n of quiz.wrong) ul.appendChild(el("li", "", cards[n - 1].a));
      box.appendChild(ul);
    }
    const text = `テスト結果 ${data.toeic.date}\n${quiz.wrong.join(",") || "なし"}`;
    const row = el("div", "row");
    row.appendChild(btn(quiz.sent ? "もう一度 PC に送る" : "結果を PC に送る", quiz.sent ? "" : "primary", () => {
      quiz.sent = true; quizSave(quiz);
      location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}&input=text&text=${encodeURIComponent(text)}`;
      setTimeout(showQuiz, 500);
    }));
    box.appendChild(row);
    box.appendChild(el("div", "aside", quiz.sent
      ? "送りました。明日の朝 PC が採点します(Dropbox の「スマホから」に結果のファイルができていれば届いています)。"
      : `iPhone のショートカット「${SHORTCUT}」が Dropbox に結果を置き、明日の朝 PC が採点します。`));
    const small = el("div", "small");
    small.appendChild(btn("最初からやり直す", "", () => { quiz = { i: 0, wrong: [], open: false, sent: false }; showQuiz(); }));
    box.appendChild(small);
  }
  view.appendChild(box);
}

// 今日の勉強。休日・水曜は型が2つあり、どちらにしたかはこの端末に覚えておく
function showStudy(view) {
  const s = data.study, vkey = "kb-study-" + s.date;
  let pick = ""; try { pick = localStorage.getItem(vkey) || ""; } catch (e) {}
  const v = s.variants.find(x => x.key === pick) || s.variants[0];
  view.innerHTML = "";
  if (s.variants.length > 1) {
    const seg = document.createElement("div"); seg.className = "seg";
    for (const x of s.variants) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = x.label; b.setAttribute("aria-pressed", String(x === v));
      b.addEventListener("click", () => { try { localStorage.setItem(vkey, x.key); } catch (e) {} showStudy(view); });
      seg.appendChild(b);
    }
    view.appendChild(seg);
  }
  view.insertAdjacentHTML("beforeend", render(v.md));
  const src = document.createElement("p"); src.className = "src";
  src.textContent = `${label(s.date)}の分。進み具合: ${s.source}`;
  view.appendChild(src);
  view.appendChild(memoBox(view));
}

// 1日の終わりの勉強メモ。ショートカット「勉強メモ」が txt にして Dropbox に置き、土曜の見直しが読む
const MEMO_SHORTCUT = "勉強メモ";
let memoDay = null, memoSent = "";
function memoBox(view) {
  const box = el("div", "memo");
  box.appendChild(el("h2", "", "今日のメモ"));
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  if (memoDay === null) memoDay = now.getHours() < 4 ? 1 : 0;  // 夜中に書くときは前の日の分
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const seg = el("div", "seg");
  [[`今日 ${md(today)}`, 0], [`昨日 ${md(yest)}`, 1]].forEach(([t, k]) => {
    const b = el("button", "", t); b.type = "button"; b.setAttribute("aria-pressed", String(memoDay === k));
    b.addEventListener("click", () => {  // 書きかけを消さないよう、ボタンの表示だけ替える
      memoDay = k; seg.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", String(i === k)));
    });
    seg.appendChild(b);
  });
  box.appendChild(seg);
  const field = (key, text) => {
    const id = "memo-" + key, l = el("label", "", text); l.htmlFor = id;
    const t = el("textarea"); t.id = id; t.rows = 2;
    try { t.value = localStorage.getItem("kb-" + id) || ""; } catch (e) {}
    t.addEventListener("input", () => { try { localStorage.setItem("kb-" + id, t.value); } catch (e) {} });
    box.appendChild(l); box.appendChild(t);
    return t;
  };
  const ng = field("ng", "できなかった"), ch = field("ch", "変えた");
  const row = el("div", "row");
  row.appendChild(btn("PC に送る", "primary", () => {
    const one = s => s.trim().replace(/\s*\n\s*/g, " ");
    const parts = [one(ng.value) && `できなかった ${one(ng.value)}`, one(ch.value) && `変えた ${one(ch.value)}`].filter(Boolean);
    if (!parts.length) { ng.focus(); return; }
    const text = `- ${md(memoDay ? yest : today)} ${parts.join(" / ")}`;
    for (const k of ["ng", "ch"]) try { localStorage.removeItem("kb-memo-" + k); } catch (e) {}
    memoSent = text;
    location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(MEMO_SHORTCUT)}&input=text&text=${encodeURIComponent(text)}`;
    setTimeout(() => showStudy(view), 500);
  }));
  box.appendChild(row);
  box.appendChild(el("div", "aside", memoSent
    ? `送りました: ${memoSent}(Dropbox の「勉強メモ スマホから」に txt ができていれば届いています)`
    : `片方だけでもよい。ショートカット「${MEMO_SHORTCUT}」が Dropbox に置き、土曜の見直しが来週の計画に反映します。`));
  return box;
}

function show(key) {
  const view = $("view");
  if (key === "toeic") {
    $("title").textContent = "単語テスト " + label(data.toeic.date);
    showQuiz();
  } else if (key === "dash") {
    $("title").textContent = "ダッシュボード";
    view.innerHTML = data.dashboard ? render(data.dashboard) : `<p class="empty">ダッシュボードがまだありません。</p>`;
  } else if (key === "study") {
    $("title").textContent = "今日の勉強";
    showStudy(view);
  } else {
    const day = data.days.find(d => d.date === key);
    $("title").textContent = label(key);
    view.innerHTML = render(day.md);
  }
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-current", String(b.dataset.key === key));
  window.scrollTo(0, 0);
}

function open() {
  $("lock").hidden = true; $("app").hidden = false;
  $("updated").textContent = "PC で更新 " + data.updated.slice(5).replace("-", "/");
  const nav = $("tabs"); nav.innerHTML = "";
  const items = data.days.map((d, i) => [d.date, i === 0 ? "今日 " + label(d.date) : label(d.date)]);
  items.splice(Math.min(1, items.length), 0, ["dash", "ダッシュボード"]);
  if (data.toeic) items.splice(Math.min(1, items.length), 0, ["toeic", "単語テスト"]);
  if (data.study) items.splice(Math.min(1, items.length), 0, ["study", "勉強"]);
  quiz = null;
  for (const [key, text] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + key; b.dataset.key = key; b.textContent = text;
    b.addEventListener("click", () => show(key));
    nav.appendChild(b);
  }
  show(data.days.length ? data.days[0].date : "dash");
}

$("lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("unlock").disabled = true; $("lockMsg").hidden = true;
  try {
    const raw = await deriveRaw($("pass").value, enc);
    data = await decrypt(raw, enc);
    store.set(tob64(raw)); $("pass").value = ""; open();
  } catch (err) { showLock("合言葉が違うようです。PC の合言葉ファイルの1行目と同じか確かめてください。"); }
  $("unlock").disabled = false;
});
$("forget").addEventListener("click", () => { store.clear(); data = null; showLock(); });

(async () => {
  try {
    const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    enc = await r.json();
  } catch (e) {
    $("lock").hidden = false; $("lockForm").hidden = true;
    $("lockMsg").hidden = false; $("lockMsg").textContent = "データを読み込めませんでした。電波のよい所で開き直してください。";
    return;
  }
  const saved = store.get();
  if (saved) {
    try { data = await decrypt(unb64(saved), enc); open(); return; }
    catch (e) { store.clear(); showLock("合言葉が変わったようです。もう一度入れてください。"); return; }
  }
  showLock();
})();
</script>
</body>
</html>
